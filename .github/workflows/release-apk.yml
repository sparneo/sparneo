name: Build APK

# ⚠️ Ce workflow ne PUBLIE rien. Les APK qu'il produit sont signés avec la clé de
# DÉBOGAGE d'Android (aucun keystore n'est configuré côté CI, et le keystore de
# release n'a délibérément pas été confié à GitHub Actions). Un tel APK est
# signé par une clé publiquement connue et n'est pas interchangeable avec celui
# de la release : Android refuse la mise à jour entre les deux.
#
# Il sert donc uniquement à vérifier que le build Android passe. L'APK publié
# est construit et signé en local, puis attaché à la main.

on:
  push:
    tags:
      # Déclenché sur les tags de version au format v* (ex. v0.1.0, v1.2.3)
      - 'v*'
  # Permet de lancer le workflow manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Lecture seule : ce workflow n'écrit dans aucune release.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Java 17 requis pour le build Gradle Android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # APK séparés par ABI (fichiers plus légers, un par architecture)
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      # APK universel (fat APK) servant de fallback pour toutes les architectures
      - name: Build universal APK
        run: flutter build apk --release

      # Note : les APK sont signés avec la clé debug (aucun keystore configuré).
      # Ils restent installables pour un test, mais NE DOIVENT PAS être publiés
      # — cf. l'avertissement en tête de fichier.

      # Regroupe les APK produits dans un dossier dédié
      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/
          ls -lh release-apks/

      # Les APK restent des artifacts de CI, téléchargeables depuis l'onglet
      # Actions. Ils ne sont jamais attachés à une release : ils sont signés
      # avec la clé de débogage (cf. avertissement en tête de fichier).
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-signed-apks
          path: release-apks/*.apk
          retention-days: 14
